name: Refresh profile contributions

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml
      - tests/test_profile.py
  pull_request:
    paths:
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml
      - tests/test_profile.py
  schedule:
    # External repository merges cannot trigger this repository directly.
    # Poll twice per hour; scheduled runs may still be delayed by GitHub.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
      - name: Validate updater rendering
        run: python3 -m unittest discover -s tests -p "test_profile.py" -v

  refresh:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Discover external merged and open PRs; generate dark GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile.py

      - name: Commit updates only when content changes
        run: |
          git add README.md
          if [ -f assets/github-stats-dark.svg ]; then git add assets/github-stats-dark.svg; fi
          if git diff --cached --quiet; then
            echo "No profile changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh merged PRs and dark GitHub stats"
          git push
